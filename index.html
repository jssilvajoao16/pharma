<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHARMASHOP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Sans', Arial, sans-serif; background: #0a1628; padding: 16px; font-size: 13px; }

    .header { background: #e8620a; border-radius: 12px; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 6px; }
    .header h1 { color: #fff; font-size: 22px; font-weight: bold; letter-spacing: 1px; }
    .header .dt { color: #fcd9b8; font-size: 12px; }

    .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab { background: #112240; border: 1px solid #1e3a5f; color: #7ab3f0; border-radius: 8px; padding: 9px 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.15s; }
    .tab.active { background: #e8620a; border-color: #e8620a; color: #fff; }
    .tab:hover:not(.active) { background: #162d50; }

    .card { background: #112240; border-radius: 12px; border: 0.5px solid #1e3a5f; padding: 16px; margin-bottom: 14px; }
    .section { display: none; }
    .section.active { display: block; }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 500px; }
    thead tr { background: #e8620a; }
    th { color: #fff; font-size: 12px; font-weight: bold; padding: 10px 1px; text-align: left; white-space: nowrap; }
    tbody tr { border-bottom: 0.5px solid #1e3a5f; }
    tbody tr:hover { background: #162d50; }
    td { padding: 4px 1px; vertical-align: middle; }

    input.fi, select.fi { background: #0a1628; border: 0.5px solid #2a4a7a; color: #fff; font-size: 12px; font-weight: bold; padding: 6px 8px; border-radius: 6px; width: 100%; outline: none; }
    input.fi { text-transform: uppercase; }
    input.fi:focus, select.fi:focus { border-color: #e8620a; box-shadow: 0 0 0 2px rgba(232,98,10,0.3); }
    input.fi:hover, select.fi:hover { border-color: #4a7ab5; }
    input.fi[readonly] { color: #7ab3f0; background: #0d1e38; }
    select.fi option { background: #0a1628; }
    .num-cell { color: #e8620a; font-size: 12px; font-weight: bold; padding: 0 8px; text-align: center; white-space: nowrap; }

    .btn-del-row { background: #3a1a1a; border: 1px solid #7a2a2a; color: #d1d5db; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; font-weight: bold; white-space: nowrap; transition: opacity 0.15s; }
    .btn-del-row:hover { opacity: 0.8; background: #5a2020; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .btn { border: none; border-radius: 8px; padding: 10px 18px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #d1d5db; transition: opacity 0.15s, transform 0.1s; }
    .btn:hover  { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
    .btn-add     { background: #1a3a5c; border: 1px solid #2a5f8f; }
    .btn-print   { background: #2a1a4a; border: 1px solid #5a3a8a; }
    .btn-new     { background: #2a2a0a; border: 1px solid #6a5a0a; }
    .btn-salvar  { background: #0f3d1a; border: 1px solid #1a7a30; }
    .btn-limpar  { background: #3a1a1a; border: 1px solid #7a2a2a; }

    /* ── TOTAIS ── */
    .total-card { background: #112240; border: 0.5px solid #1e3a5f; border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; }
    .total-rows { display: flex; flex-direction: column; gap: 6px; }
    .total-row { display: flex; justify-content: space-between; align-items: center; color: #7ab3f0; font-size: 13px; }
    .total-row.destaque { background: #e8620a; border-radius: 10px; padding: 12px 16px; margin-top: 4px; }
    .total-row.destaque .total-label { color: #fff; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
    .total-row.destaque .total-val { background: #fff; color: #e8620a; font-size: 24px; font-weight: bold; padding: 6px 16px; border-radius: 8px; min-width: 130px; text-align: center; }
    .total-row .lbl { color: #7ab3f0; font-weight: bold; font-size: 13px; }
    .total-row .val { color: #fff; font-weight: bold; font-size: 13px; }
    .total-row .val.troco-ok { color: #4ade80; }
    .total-row .val.troco-err { color: #f87171; }

    .hist-vazio { color: #4a7ab5; text-align: center; padding: 30px 0; font-size: 13px; }
    .hist-card { background: #0d1e38; border: 0.5px solid #1e3a5f; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
    .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 4px; }
    .hist-id { color: #e8620a; font-weight: bold; font-size: 13px; }
    .hist-data { color: #7ab3f0; font-size: 11px; }
    .hist-total { color: #fff; font-weight: bold; font-size: 15px; }
    .hist-itens { font-size: 11px; color: #7ab3f0; margin-top: 4px; word-break: break-word; }
    .hist-cliente { font-size: 11px; color: #fcd9b8; margin-top: 3px; }
    .hist-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .btn-sm { border: none; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: bold; cursor: pointer; color: #d1d5db; transition: opacity 0.15s; }
    .btn-sm:hover { opacity: 0.8; }
    .btn-sm-del   { background: #3a1a1a; border: 1px solid #7a2a2a; }
    .badge-count { background: #e8620a; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }

    /* ── BLOCOS DE DADOS ── */
    .loja-info, .cliente-info, .entrega-info { background: #0d1e38; border: 0.5px solid #1e3a5f; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
    .bloco-titulo { color: #e8620a; font-size: 11px; font-weight: bold; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
    .fields-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .fields-grid label { color: #7ab3f0; font-size: 12px; font-weight: bold; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
    .fields-grid input, .fields-grid select { background: #0a1628; border: 0.5px solid #2a4a7a; color: #fff; font-size: 12px; font-weight: bold; padding: 6px 8px; border-radius: 6px; outline: none; }
    .fields-grid input { text-transform: uppercase; }
    .fields-grid input:focus, .fields-grid select:focus { border-color: #e8620a; }
    .fields-grid select option { background: #0a1628; }

   /* ── RESPONSIVIDADE ── */
    @media (max-width: 1024px) {
        .fields-grid label { flex: 1 1 calc(50% - 10px); }
    }
    @media (max-width: 768px) {
        body { padding: 10px; }
        .header { padding: 12px 14px; } .header h1 { font-size: 18px; }
        .tab { padding: 8px 14px; font-size: 12px; flex: 1; text-align: center; }
        .card { padding: 12px; }
        .btn { padding: 9px 14px; font-size: 12px; flex: 1 1 calc(50% - 8px); justify-content: center; }
        .fields-grid label { min-width: 100%; flex: 1 1 100%; }
        /* Entrega e pagamento em coluna no tablet */
        div[style*="flex-direction:row"][style*="flex-wrap:nowrap"] {
            flex-wrap: wrap !important;
            gap: 12px !important;
        }
        .total-row.destaque .total-val { font-size: 22px; min-width: 120px; }
    }
    @media (max-width: 600px) {
        /* Tabela rola horizontalmente */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { min-width: 480px; }
        th { font-size: 10px; padding: 8px 2px; }
        td { padding: 3px 2px; }
        input.fi { font-size: 11px; padding: 5px 4px; }
        /* Entrega e pagamento empilham */
        div[style*="flex-direction:row"][style*="flex-wrap:nowrap"] {
            flex-direction: column !important;
            flex-wrap: wrap !important;
            gap: 10px !important;
        }
        div[style*="flex-direction:row"][style*="flex-wrap:nowrap"] label {
            width: 100% !important;
        }
        div[style*="flex-direction:row"][style*="flex-wrap:nowrap"] label input,
        div[style*="flex-direction:row"][style*="flex-wrap:nowrap"] label select {
            width: 100% !important;
        }
    }
    @media (max-width: 480px) {
        body { padding: 8px; }
        .header h1 { font-size: 16px; } .header .dt { font-size: 10px; }
        .tab { padding: 8px 10px; font-size: 11px; }
        .card { padding: 10px; }
        table { min-width: 420px; }
        th { font-size: 10px; padding: 8px 2px; } td { padding: 3px 1px; }
        input.fi { font-size: 11px; padding: 5px 6px; }
        .btn-del-row { padding: 4px 8px; font-size: 10px; }
        .btn { padding: 9px 10px; font-size: 11px; flex: 1 1 calc(50% - 6px); justify-content: center; }
        .total-row.destaque .total-val { font-size: 20px; min-width: 110px; }
        .fields-grid label { min-width: 100%; flex: 1 1 100%; }
        .btn-row { gap: 6px; }
        .btn-row .btn { flex: 1 1 100%; }
        .hist-actions { flex-direction: column; }
        .btn-sm { width: 100%; text-align: center; }
    }
    @media (max-width: 360px) {
        .header h1 { font-size: 14px; }
        .tab { font-size: 10px; padding: 7px 8px; }
        table { min-width: 380px; }
        th { font-size: 9px; }
        input.fi { font-size: 10px; padding: 4px 4px; }
        .total-row.destaque .total-val { font-size: 18px; min-width: 90px; }
    }
    /* ── OCULTAR DADOS DA FARMÁCIA NA TELA ── */
    .loja-info { display: none; }

    /* ── CUPOM TÉRMICO ── */
    #cupom-impressao { display: none; }

    @media print {
        body > *:not(#cupom-impressao) { display: none !important; }
        #cupom-impressao { display: block !important; }
        @page { size: 80mm 297mm; margin: 5mm; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; font-size: 11px; background: #fff !important; }
        #cupom-impressao {
            font-family: 'Arial', Courier, monospace !important;
            font-size: 7pt !important; color: #000 !important;
            background: #fff !important; width: 72mm !important;
            max-width: 72mm !important; line-height: 1.3 !important;
            letter-spacing: 0 !important; word-break: break-word;
        }
        .cp-center      { text-align: center; }
        .cp-right       { text-align: right; }
        .cp-left        { text-align: left; }
        .cp-bold        { font-weight: bold; }
        .cp-big         { font-size: 9.5pt; font-weight: bold; text-align: center; letter-spacing: 0; }
        .cp-med         { font-size: 8.5pt; font-weight: bold; text-align: center; }
        .cp-line        { border-top: 1px dashed #000; margin: 3px 0; }
        .cp-line-solid  { border-top: 1px solid #000; margin: 3px 0; }
        .cp-row         { display: flex; justify-content: space-between; }
        .cp-row span    { font-family: 'Arial', Courier, monospace; font-size: 8pt; }
        .cp-item-block  { margin-bottom: 2px; }
        .cp-item-nome   { font-weight: bold; font-size: 8pt; }
        .cp-item-detail { display: flex; justify-content: space-between; font-size: 8pt; padding-left: 2px; }
        .cp-total-box   { border: 2px solid #000; padding: 3px 5px; margin: 5px 0; text-align: center; }
        .cp-total-num   { font-size: 13pt; font-weight: bold; letter-spacing: 0; }
        .cp-rodape      { text-align: center; font-size: 7.5pt; margin-top: 3px; }
        .cp-cliente-box    { border: 1px solid #000; padding: 4px 5px; margin: 5px 0; }
        .cp-cliente-titulo { font-weight: bold; font-size: 8.5pt; text-align: center; margin-bottom: 2px; }
        .cp-cliente-row    { font-size: 8pt; margin-bottom: 2px; word-break: break-word; }
        .cp-cliente-row b  { font-weight: bold; }
        .cp-pgto-box    { border: 1px dashed #000; padding: 3px 5px; margin: 5px 0; font-size: 8pt; }
    }

    /* ── VIEW TRANSITIONS entre abas ── */
    ::view-transition-old(aba-conteudo) {
        animation: 140ms ease-in both vt-slide-out;
    }
    ::view-transition-new(aba-conteudo) {
        animation: 380ms ease-out both vt-slide-in;
    }
    @keyframes vt-slide-out {
        from { opacity: 1; transform: translateX(0); }
        to   { opacity: 0; transform: translateX(-35px); }
    }
    @keyframes vt-slide-in {
        from { opacity: 0; transform: translateX(35px); }
        to   { opacity: 1; transform: translateX(0); }
    }
    .section { view-transition-name: none; }
    .section.active { view-transition-name: aba-conteudo; }

    /* ═══════════════ MODO DIA / NOITE (ADICIONADO) ═══════════════ */
    .btn-tema {
        background: #0a1628; border: 1px solid #2a4a7a; color: #fff;
        border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: bold;
        cursor: pointer; display: flex; align-items: center; gap: 6px;
        transition: opacity 0.15s, transform 0.1s;
    }
    .btn-tema:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-tema:active { transform: scale(0.97); }

    body.modo-dia { background: #eef2f8; }
    body.modo-dia .header { background: #e8620a; }
    body.modo-dia .btn-tema { background: #ffffff; border-color: #c3cfe0; color: #0a1628; }

    body.modo-dia .tab { background: #ffffff; border-color: #d6dfec; color: #4a7ab5; }
    body.modo-dia .tab.active { background: #e8620a; border-color: #e8620a; color: #fff; }
    body.modo-dia .tab:hover:not(.active) { background: #f2f6fc; }

    body.modo-dia .card,
    body.modo-dia .total-card,
    body.modo-dia .loja-info,
    body.modo-dia .cliente-info,
    body.modo-dia .entrega-info,
    body.modo-dia .hist-card { background: #ffffff; border-color: #d6dfec; }

    body.modo-dia thead tr { background: #e8620a; }
    body.modo-dia tbody tr { border-bottom-color: #e2e8f0; }
    body.modo-dia tbody tr:hover { background: #f5f8fc; }

    body.modo-dia input.fi,
    body.modo-dia select.fi,
    body.modo-dia .fields-grid input,
    body.modo-dia .fields-grid select {
        background: #f7f9fc; border-color: #c3cfe0; color: #0a1628;
    }
    body.modo-dia input.fi[readonly] { color: #e8620a; background: #eef2f8; }
    body.modo-dia select.fi option,
    body.modo-dia .fields-grid select option { background: #ffffff; color: #0a1628; }
    body.modo-dia .num-cell { color: #e8620a; }

    body.modo-dia .btn-del-row { background: #fbdada; border-color: #e69a9a; color: #7a2a2a; }
    body.modo-dia .btn-add     { background: #dbe8fb; border-color: #a9c6ec; color: #0a1628; }
    body.modo-dia .btn-print   { background: #e8def9; border-color: #c3a9ec; color: #0a1628; }
    body.modo-dia .btn-new     { background: #faf6d8; border-color: #e6d98a; color: #0a1628; }
    body.modo-dia .btn-salvar  { background: #d7f3dd; border-color: #8fd6a0; color: #0a1628; }
    body.modo-dia .btn-limpar  { background: #fbdada; border-color: #e69a9a; color: #0a1628; }

    body.modo-dia .total-row .lbl { color: #4a7ab5; }
    body.modo-dia .total-row .val { color: #0a1628; }
    body.modo-dia .total-row.destaque { background: #e8620a; }
    body.modo-dia .total-row.destaque .total-val { background: #ffffff; color: #e8620a; }

    body.modo-dia .hist-vazio { color: #8ba3c7; }
    body.modo-dia .hist-data { color: #4a7ab5; }
    body.modo-dia .hist-itens { color: #4a7ab5; }
    body.modo-dia .hist-cliente { color: #b5651d; }
    body.modo-dia .hist-total { color: #0a1628; }
    body.modo-dia .btn-sm-del { background: #fbdada; border-color: #e69a9a; color: #7a2a2a; }
    body.modo-dia .btn-sm[style*="background:#1a3a5c"] { background: #dbe8fb !important; border-color: #a9c6ec !important; color: #0a1628 !important; }

    body.modo-dia .bloco-titulo { color: #e8620a; }
    body.modo-dia .fields-grid label { color: #4a7ab5; }
    body.modo-dia div[style*="color:#7ab3f0"] { color: #4a7ab5 !important; }

    /* ═══════════════ ÍCONES SVG (ADICIONADO) ═══════════════ */
    .ic {
        width: 15px; height: 15px; vertical-align: -3px; margin-right: 5px;
        stroke: currentColor; fill: none; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }
    .tab .ic { margin-right: 6px; }
    .bloco-titulo .ic { width: 13px; height: 13px; margin-right: 6px; }
    .btn-tema .ic { margin-right: 4px; }

    /* ═══ CLIENTES (ADICIONADO) ═══ */
    .busca-wrap { position: relative; }
    .busca-res { position: absolute; left: 0; right: 0; top: 100%; z-index: 50; background: #0a1628; border: 1px solid #2a4a7a; border-radius: 8px; max-height: 240px; overflow-y: auto; margin-top: 4px; display: none; }
    .busca-item { padding: 8px 12px; cursor: pointer; border-bottom: 0.5px solid #1e3a5f; color: #fff; font-size: 12px; }
    .busca-item:hover { background: #162d50; }
    .busca-item small { display: block; color: #7ab3f0; font-size: 11px; margin-top: 2px; }
    .busca-vazio { padding: 10px 12px; color: #4a7ab5; font-size: 12px; }
    .cli-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    body.modo-dia .busca-res { background: #fff; border-color: #c3cfe0; }
    body.modo-dia .busca-item { color: #0a1628; border-bottom-color: #e2e8f0; }
    body.modo-dia .busca-item:hover { background: #f5f8fc; }
    body.modo-dia .busca-item small { color: #4a7ab5; }
    .btn-cli-salvar { background: rgba(232,98,10,0.15); border: 1px solid #e8620a; color: #fcd9b8; }
    .btn-cli-salvar:hover { background: #e8620a; color: #fff; }
    body.modo-dia .btn-cli-salvar { background: #fff1e6; border-color: #e8620a; color: #b34a05; }
    body.modo-dia .btn-cli-salvar:hover { background: #e8620a; color: #fff; }
    .backup-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .backup-row .btn { padding: 7px 14px; font-size: 12px; flex: 0 0 auto; }
    .backup-row small { color: #4a7ab5; font-size: 11px; }
</style>
</head>
<body>

<div class="header">
    <h1>PHARMASHOP</h1>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <span class="dt" id="dt"></span>
        <button class="btn-tema" id="btnTema" onclick="alternarTema()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>Modo Noite</button>
    </div>
</div>

<div class="tabs">
    <button class="tab active" onclick="trocarAba('pedido', this)"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>Novo Pedido</button>
    <button class="tab" onclick="trocarAba('historico', this)"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>Histórico <span class="badge-count" id="badge">0</span></button>
</div>

<!-- ══════════ ABA PEDIDO ══════════ -->
<div id="sec-pedido" class="section active">

    <!-- Dados da loja -->
    <div class="loja-info">
        <div class="bloco-titulo"><svg class="ic" viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M4 9v10a1 1 0 0 0 1 1h4v-6h6v6h4a1 1 0 0 0 1-1V9"/></svg>Dados da Farmácia</div>
        <div class="fields-grid">
            <label>NOME DA FARMÁCIA
                <input type="text" id="loja_nome" value="PHARMASHOP" maxlength="30" oninput="this.value=this.value.toUpperCase()">
            </label>
            <label>CNPJ
                <input type="text" id="loja_cnpj" value="01.823.321/0001-59" maxlength="18">
            </label>
            <label>ENDEREÇO
                <input type="text" id="loja_end" value="RUA:BENÍCIO FERNANDES 212-SÃO JOSÉ DA MATA" maxlength="55" oninput="this.value=this.value.toUpperCase()">
            </label>
            <label>TELEFONE
                <input type="text" id="loja_tel" value="(83) 3314-1157" maxlength="18">
            </label>
        </div>
    </div>

    <!-- Dados do cliente -->
    <div class="cliente-info">
        <div class="bloco-titulo"><svg class="ic" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Dados do Cliente</div>
        <div class="fields-grid">
            <label>NOME DO CLIENTE
                <input type="text" id="cli_nome" placeholder="NOME COMPLETO" maxlength="50" oninput="this.value=this.value.toUpperCase()">
            </label>
            <label>TELEFONE DO CLIENTE
                <input type="text" id="cli_tel" placeholder="(XX) XXXXX-XXXX" maxlength="20">
            </label>
            <label style="flex: 2; min-width: 200px;">ENDEREÇO DE ENTREGA
                <input type="text" id="cli_end" placeholder="RUA, Nº, BAIRRO" maxlength="80" oninput="this.value=this.value.toUpperCase()">
            </label>
            <label>PONTO DE REFERÊNCIA
                <input type="text" id="cli_ref" placeholder="EX: PRÓXIMO AO MERCADO" maxlength="60" oninput="this.value=this.value.toUpperCase()">
            </label>
        </div>
    </div>

    <!-- Entrega e Pagamento -->
    <div class="entrega-info">
        <div class="bloco-titulo"><svg class="ic" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Entrega e Pagamento</div>
        <div style="display:flex; flex-direction:row; align-items:flex-end; gap:24px; flex-wrap:nowrap;">
            <label style="display:flex; flex-direction:column; gap:4px; color:#7ab3f0; font-size:12px; font-weight:bold; white-space:nowrap; min-width:0;">TAXA DE ENTREGA (R$)
                <input type="text" id="taxa_entrega" placeholder="0,00" maxlength="10" oninput="calcTaxaTroco()" class="fi" style="width:80px;">
            </label>
            <label style="display:flex; flex-direction:column; gap:4px; color:#7ab3f0; font-size:12px; font-weight:bold; white-space:nowrap; min-width:0;">FORMA DE PAGAMENTO
                <select id="forma_pgto" onchange="toggleTroco()" class="fi" style="width:130px;">
                    <option value="DINHEIRO">DINHEIRO</option>
                    <option value="CARTÃO">CARTÃO</option>
                    <option value="PIX">PIX</option>
                </select>
            </label>
            <label id="label_troco" style="display:flex; flex-direction:column; gap:4px; color:#7ab3f0; font-size:12px; font-weight:bold; white-space:nowrap; min-width:0;">VALOR PARA TROCO (R$)
                <input type="text" id="valor_recebido" placeholder="0,00" maxlength="10" oninput="calcTaxaTroco()" class="fi" style="width:80px;">
            </label>
        </div>
    </div>

    <!-- Tabela de itens -->
    <div class="card">
        <div class="table-wrap">
            <table id="tbl">
                <thead>
                    <tr>
                        <th style="width:28px">Nº</th>
                        <th style="min-width:340px">PRODUTO</th>
                        <th style="width:65px">QTDE</th>
                        <th style="width:78px">VL. UNIT</th>
                        <th style="width:85px">TOTAL</th>
                        <th style="width:85px">AÇÃO</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="btn-row">
            <button class="btn btn-add"    onclick="addRow()"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Adicionar Item</button>
            <button class="btn btn-salvar" onclick="salvarPedido()"><svg class="ic" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Finalizar e Salvar</button>
            <button class="btn btn-print"  onclick="imprimirCupom()"><svg class="ic" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Imprimir Cupom</button>
            <button class="btn btn-new"    onclick="novoPedido()"><svg class="ic" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>Novo Pedido</button>
        </div>
    </div>

    <!-- Totais -->
    <div class="total-card">
        <div class="total-rows">
            <div class="total-row">
                <span class="lbl">Subtotal dos Produtos</span>
                <span class="val" id="subtotal_prod">R$ 0,00</span>
            </div>
            <div class="total-row">
                <span class="lbl">Taxa de Entrega</span>
                <span class="val" id="total_taxa">R$ 0,00</span>
            </div>
            <div class="total-row destaque">
                <span class="total-label">TOTAL A PAGAR</span>
                <span class="total-val" id="total_geral">R$ 0,00</span>
            </div>
            <div class="total-row" id="row_troco" style="display:none;">
                <span class="lbl">Troco</span>
                <span class="val" id="val_troco">R$ 0,00</span>
            </div>
        </div>

</div>

<!-- ══════════ ABA HISTÓRICO ══════════ -->
<div id="sec-historico" class="section">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
            <span style="color:#7ab3f0; font-size:13px; font-weight:bold;">Pedidos salvos</span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-salvar" style="padding:6px 14px; font-size:12px;" onclick="gerarXLSX()"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>Exportar .xlsx</button>
                <button class="btn btn-print"  style="padding:6px 14px; font-size:12px;" onclick="gerarRelatorioPDF()"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>Salvar PDF</button>
                <button class="btn btn-limpar" style="padding:6px 14px; font-size:12px;" onclick="limparHistorico()"><svg class="ic" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>Limpar Tudo</button>
            </div>
        </div>
        <div id="lista-historico"></div>
    </div>
</div>

<!-- ══════════ CUPOM TÉRMICO ══════════ -->
<div id="cupom-impressao"></div>

<script>
/* ─── UTILITÁRIOS ─── */
function fmtDt() {
    var d = new Date();
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR');
}
document.getElementById('dt').textContent = fmtDt();

function parseBR(s) {
    return parseFloat(String(s || '0').replace(/\./g,'').replace(',','.')) || 0;
}

function fmtBR(n) {
    return 'R$ ' + n.toFixed(2).replace('.', ',');
}

/* ─── ABAS ─── */
function _aplicarAba(aba, el) {
    document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.getElementById('sec-' + aba).classList.add('active');
    el.classList.add('active');
    if (aba === 'historico') renderHistorico();
}
function trocarAba(aba, el) {
    if (document.startViewTransition) {
        document.startViewTransition(function() { _aplicarAba(aba, el); });
    } else {
        _aplicarAba(aba, el);
    }
}

/* ─── TABELA DE ITENS ─── */
function renumerar() {
    document.querySelectorAll('#tbody tr').forEach(function(r, i){
        r.querySelector('.num-cell').textContent = i + 1;
    });
}

function makeRow(n) {
    var tr = document.createElement('tr');
    var td0 = document.createElement('td');
    td0.className = 'num-cell'; td0.textContent = n;
    tr.appendChild(td0);

    var fields = [
        { ph: 'NOME DO PRODUTO', ro: false, w: '340px' },
        { ph: '0',               ro: false, w: '43px'  },
        { ph: '0,00',            ro: false, w: '57px'  },
        { ph: '0,00',            ro: true,  w: '63px'  }
    ];

    fields.forEach(function(f, i) {
        var td  = document.createElement('td');
        var inp = document.createElement('input');
        inp.type = 'text'; inp.className = 'fi';
        inp.placeholder = f.ph; inp.readOnly = f.ro;
        inp.style.width = f.w;
        inp.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
            if (i === 1 || i === 2) { calcRow(tr); upTotal(); }
        });
        inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                var inps = tr.querySelectorAll('input:not([readonly])');
                var idx2 = Array.prototype.indexOf.call(inps, this);
                if (idx2 < inps.length - 1) { inps[idx2 + 1].focus(); }
                else { addRow(); document.getElementById('tbody').lastElementChild.querySelector('input.fi').focus(); }
            }
        });
        td.appendChild(inp);
        tr.appendChild(td);
    });

    var tdA = document.createElement('td');
    var btn = document.createElement('button');
    btn.className = 'btn-del-row'; btn.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Excluir Item';
    btn.onclick = function() {
        if (document.getElementById('tbody').rows.length > 1) {
            tr.remove(); renumerar(); upTotal();
        }
    };
    tdA.appendChild(btn);
    tr.appendChild(tdA);
    return tr;
}

function calcRow(tr) {
    var inp = tr.querySelectorAll('input');
    var q = parseBR(inp[1].value);
    var v = parseBR(inp[2].value);
    inp[3].value = (q * v).toFixed(2).replace('.', ',');
}

function upTotal() {
    var sub = 0;
    document.querySelectorAll('#tbody tr').forEach(function(r) {
        sub += parseBR(r.querySelectorAll('input')[3].value);
    });
    var taxa = parseBR(document.getElementById('taxa_entrega').value);
    var total = sub + taxa;
    document.getElementById('subtotal_prod').textContent = fmtBR(sub);
    document.getElementById('total_taxa').textContent    = fmtBR(taxa);
    document.getElementById('total_geral').textContent   = fmtBR(total);
    calcTaxaTroco();
}

function calcTaxaTroco() {
    var taxa = parseBR(document.getElementById('taxa_entrega').value);
    var sub  = 0;
    document.querySelectorAll('#tbody tr').forEach(function(r) {
        sub += parseBR(r.querySelectorAll('input')[3].value);
    });
    var total = sub + taxa;
    document.getElementById('subtotal_prod').textContent = fmtBR(sub);
    document.getElementById('total_taxa').textContent    = fmtBR(taxa);
    document.getElementById('total_geral').textContent   = fmtBR(total);

    var forma = document.getElementById('forma_pgto').value;
    var rowTroco = document.getElementById('row_troco');
    if (forma === 'DINHEIRO') {
        var recebido = parseBR(document.getElementById('valor_recebido').value);
        var troco = recebido - total;
        rowTroco.style.display = 'flex';
        var elTroco = document.getElementById('val_troco');
        if (recebido === 0) {
            elTroco.textContent = '—';
            elTroco.className = 'val';
        } else if (troco >= 0) {
            elTroco.textContent = fmtBR(troco);
            elTroco.className = 'val troco-ok';
        } else {
            elTroco.textContent = '⚠ Valor insuficiente (' + fmtBR(Math.abs(troco)) + ' a menos)';
            elTroco.className = 'val troco-err';
        }
    } else {
        rowTroco.style.display = 'none';
    }
}

function toggleTroco() {
    var forma = document.getElementById('forma_pgto').value;
    document.getElementById('label_troco').style.display = (forma === 'DINHEIRO') ? 'flex' : 'none';
    calcTaxaTroco();
}

function addRow() {
    var tb = document.getElementById('tbody');
    tb.appendChild(makeRow(tb.rows.length + 1));
}

function novoPedido() {
    var tb = document.getElementById('tbody');
    while (tb.rows.length > 0) tb.deleteRow(0);
    // Limpa campos do cliente
    ['cli_nome','cli_tel','cli_end','cli_ref','taxa_entrega','valor_recebido'].forEach(function(id){
        document.getElementById(id).value = '';
    });
    document.getElementById('forma_pgto').value = 'DINHEIRO';
    toggleTroco();
    addRow(); upTotal();
}

/* ─── COLETA DE DADOS ─── */
function coletarItens() {
    var itens = [];
    document.querySelectorAll('#tbody tr').forEach(function(r) {
        var inp = r.querySelectorAll('input');
        var prod = inp[0].value.trim();
        if (prod) {
            itens.push({
                produto: prod,
                qtde:    inp[1].value || '1',
                vlUnit:  inp[2].value || '0,00',
                total:   inp[3].value || '0,00'
            });
        }
    });
    return itens;
}

function dadosLoja() {
    return {
        nome: document.getElementById('loja_nome').value || 'PHARMASHOP',
        cnpj: document.getElementById('loja_cnpj').value || '',
        end:  document.getElementById('loja_end').value  || '',
        tel:  document.getElementById('loja_tel').value  || ''
    };
}

function dadosCliente() {
    return {
        nome: document.getElementById('cli_nome').value.trim() || '',
        tel:  document.getElementById('cli_tel').value.trim()  || '',
        end:  document.getElementById('cli_end').value.trim()  || '',
        ref:  document.getElementById('cli_ref').value.trim()  || ''
    };
}

function dadosEntrega() {
    var taxa = parseBR(document.getElementById('taxa_entrega').value);
    var forma = document.getElementById('forma_pgto').value;
    var recebido = parseBR(document.getElementById('valor_recebido').value);
    var totalGeral = parseBR(document.getElementById('total_geral').textContent.replace('R$','').trim());
    var troco = (forma === 'DINHEIRO' && recebido > 0) ? Math.max(0, recebido - totalGeral) : 0;
    return {
        taxa:      taxa.toFixed(2).replace('.', ','),
        forma:     forma,
        recebido:  recebido > 0 ? recebido.toFixed(2).replace('.', ',') : '',
        troco:     troco > 0    ? troco.toFixed(2).replace('.', ',')    : ''
    };
}

/* ─── GERAR CUPOM HTML ─── */
function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function gerarCupomHTML(itens, totalStr, loja, id, dataStr, cliente, entrega) {
    var NUM_COLS = 42;

    function itemLinhas(it, num) {
        var nomeDisp = num + '. ' + it.produto;
        var nomePartes = [];
        while (nomeDisp.length > NUM_COLS) {
            nomePartes.push(nomeDisp.substring(0, NUM_COLS));
            nomeDisp = '    ' + nomeDisp.substring(NUM_COLS);
        }
        nomePartes.push(nomeDisp);
        var qtd    = it.qtde + ' x R$' + it.vlUnit;
        var totStr = 'R$ ' + it.total;
        return '<div class="cp-item-block">' +
            nomePartes.map(function(p){ return '<div class="cp-item-nome">' + escHtml(p) + '</div>'; }).join('') +
            '<div class="cp-item-detail"><span>' + escHtml(qtd) + '</span><span>' + escHtml(totStr) + '</span></div>' +
            '</div>';
    }

    var itensHTML = '';
    itens.forEach(function(it, i) { itensHTML += itemLinhas(it, i + 1); });

    var qtdTotal = 0;
    itens.forEach(function(it){ qtdTotal += parseInt(it.qtde) || 1; });

    // Subtotal e taxa
    var sub = 0;
    itens.forEach(function(it){ sub += parseBR(it.total); });
    var taxa = parseBR(entrega.taxa);

    // Bloco do cliente
    var clienteHTML = '';
    if (cliente && (cliente.nome || cliente.end)) {
        clienteHTML =
            '<div class="cp-line-solid"></div>' +
            '<div class="cp-cliente-box">' +
                '<div class="cp-cliente-titulo">🛵ENTREGA / CLIENTE</div>' +
                (cliente.nome ? '<div class="cp-cliente-row"><b>Cliente:</b> ' + escHtml(cliente.nome) + '</div>' : '') +
                (cliente.tel  ? '<div class="cp-cliente-row"><b>Telefone:</b> ' + escHtml(cliente.tel) + '</div>' : '') +
                (cliente.end  ? '<div class="cp-cliente-row"><b>Endereço:</b> ' + escHtml(cliente.end) + '</div>' : '') +
                (cliente.ref  ? '<div class="cp-cliente-row"><b>Referência:</b> ' + escHtml(cliente.ref) + '</div>' : '') +
            '</div>';
    }

    // Bloco de pagamento
    var pgtoHTML =
        '<div class="cp-pgto-box">' +
            '<div class="cp-row"><span><b>Pagamento:</b></span><span>' + escHtml(entrega.forma) + '</span></div>' +
            (entrega.taxa !== '0,00' && entrega.taxa !== ''
                ? '<div class="cp-row"><span>Taxa de entrega:</span><span>R$ ' + escHtml(entrega.taxa) + '</span></div>'
                : '') +
            (entrega.forma === 'DINHEIRO' && entrega.recebido
                ? '<div class="cp-row"><span>Recebido:</span><span>R$ ' + escHtml(entrega.recebido) + '</span></div>'
                : '') +
            (entrega.forma === 'DINHEIRO' && entrega.troco
                ? '<div class="cp-row"><span><b>Troco:</b></span><span><b>R$ ' + escHtml(entrega.troco) + '</b></span></div>'
                : '') +
        '</div>';

    var html =
        '<div class="cp-big">' + escHtml(loja.nome) + '</div>' +
        (loja.cnpj ? '<div class="cp-center">CNPJ: ' + escHtml(loja.cnpj) + '</div>' : '') +
        (loja.end  ? '<div class="cp-center" style="font-size:7.5pt">' + escHtml(loja.end) + '</div>' : '') +
        (loja.tel  ? '<div class="cp-center">Tel: ' + escHtml(loja.tel) + '</div>' : '') +
        '<div class="cp-line-solid"></div>' +
        '<div class="cp-center cp-bold">CUPOM NAO FISCAL</div>' +
        '<div class="cp-line"></div>' +
        '<div class="cp-row"><span>Pedido: <b>' + escHtml(id) + '</b></span><span>' + escHtml(dataStr) + '</span></div>' +
        '<div class="cp-line"></div>' +
        '<div class="cp-center cp-bold" style="margin-bottom:3px">ITENS DO PEDIDO</div>' +
        itensHTML +
        '<div class="cp-line"></div>' +
        '<div class="cp-row"><span>Itens (qtd.):</span><span>' + qtdTotal + '</span></div>' +
        '<div class="cp-row"><span>Produtos:</span><span>' + itens.length + '</span></div>' +
        (taxa > 0 ? '<div class="cp-row"><span>Subtotal:</span><span>R$ ' + sub.toFixed(2).replace('.',',') + '</span></div>' : '') +
        (taxa > 0 ? '<div class="cp-row"><span>Taxa entrega:</span><span>R$ ' + entrega.taxa + '</span></div>' : '') +
        '<div class="cp-line-solid"></div>' +
        '<div class="cp-total-box">' +
            '<div class="cp-center cp-bold">TOTAL A PAGAR</div>' +
            '<div class="cp-center cp-total-num">' + escHtml(totalStr) + '</div>' +
        '</div>' +
        pgtoHTML +
        clienteHTML +
        '<div class="cp-line"></div>' +
        '<div class="cp-rodape">Obrigado pela preferencia!</div>' +
        '<div class="cp-rodape">Volte sempre :)</div>' +
        '<div class="cp-line"></div>' +
        '<div class="cp-rodape" style="font-size:7pt">' + escHtml(dataStr) + '</div>' +
        '<div style="height:20mm"></div>';

    return html;
}

/* ─── IMPRIMIR CUPOM ─── */
function imprimirCupom() {
    var itens = coletarItens();
    if (itens.length === 0) { alert('Adicione pelo menos um produto antes de imprimir.'); return; }
    var historico = carregarHistorico();
    var id = '#' + (historico.length + 1).toString().padStart(4, '0');
    var totalStr = document.getElementById('total_geral').textContent;
    var loja = dadosLoja();
    var cliente = dadosCliente();
    var entrega = dadosEntrega();
    var dataStr = fmtDt();
    document.getElementById('cupom-impressao').innerHTML = gerarCupomHTML(itens, totalStr, loja, id, dataStr, cliente, entrega);
    window.print();
}

/* ─── SALVAR PEDIDO ─── */
function salvarPedido() {
    var itens = coletarItens();
    if (itens.length === 0) { alert('Adicione pelo menos um produto antes de salvar.'); return; }
    var totalStr  = document.getElementById('total_geral').textContent;
    var historico = carregarHistorico();
    var id = '#' + (historico.length + 1).toString().padStart(4, '0');
    var loja    = dadosLoja();
    var cliente = dadosCliente();
    var entrega = dadosEntrega();
    historico.push({ id: id, data: fmtDt(), itens: itens, total: totalStr, loja: loja, cliente: cliente, entrega: entrega });
    localStorage.setItem('pharmashop_historico', JSON.stringify(historico));
    atualizarBadge();
    alert('Pedido ' + id + ' salvo com sucesso!');
    novoPedido();
}

/* ─── HISTÓRICO ─── */
function carregarHistorico() {
    try { return JSON.parse(localStorage.getItem('pharmashop_historico')) || []; }
    catch(e) { return []; }
}

function atualizarBadge() {
    document.getElementById('badge').textContent = carregarHistorico().length;
}

function renderHistorico() {
    var lista = document.getElementById('lista-historico');
    var hist  = carregarHistorico();
    if (hist.length === 0) {
        lista.innerHTML = '<div class="hist-vazio">Nenhum pedido salvo ainda.</div>';
        return;
    }
    lista.innerHTML = '';
    hist.slice().reverse().forEach(function(p, idx) {
        var realIdx = hist.length - 1 - idx;
        var div = document.createElement('div'); div.className = 'hist-card';
        var resumo = p.itens.map(function(i){ return i.produto + ' (' + i.qtde + 'x)'; }).join(', ');
        var cli = p.cliente || {};
        var cliInfo = [cli.nome, cli.tel, cli.end].filter(Boolean).join(' | ');
        var ent = p.entrega || {};
        var pgto = ent.forma ? ('💳 ' + ent.forma + (ent.taxa && ent.taxa !== '0,00' ? ' | Entrega: R$' + ent.taxa : '')) : '';
        div.innerHTML =
            '<div class="hist-header">' +
              '<span class="hist-id">Pedido ' + p.id + '</span>' +
              '<span class="hist-data">' + p.data + '</span>' +
            '</div>' +
            (cliInfo ? '<div class="hist-cliente">👤 ' + cliInfo + '</div>' : '') +
            (pgto    ? '<div class="hist-cliente">' + pgto + '</div>' : '') +
            '<div class="hist-itens">' + resumo + '</div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px;">' +
              '<span class="hist-total">' + p.total + '</span>' +
              '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                '<button class="btn-sm" style="background:#1a3a5c;border:1px solid #2a5f8f;" onclick="reimprimir(' + realIdx + ')"><svg class="ic" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Reimprimir</button>' +
                '<button class="btn-sm btn-sm-del" onclick="excluirPedido(' + realIdx + ')"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Excluir</button>' +
              '</div>' +
            '</div>';
        lista.appendChild(div);
    });
}

function reimprimir(idx) {
    var hist = carregarHistorico();
    var p = hist[idx]; if (!p) return;
    var loja    = p.loja    || dadosLoja();
    var cliente = p.cliente || {};
    var entrega = p.entrega || { taxa:'0,00', forma:'DINHEIRO', recebido:'', troco:'' };
    document.getElementById('cupom-impressao').innerHTML = gerarCupomHTML(p.itens, p.total, loja, p.id, p.data, cliente, entrega);
    window.print();
}

function excluirPedido(idx) {
    if (!confirm('Excluir este pedido do histórico?')) return;
    var hist = carregarHistorico();
    hist.splice(idx, 1);
    localStorage.setItem('pharmashop_historico', JSON.stringify(hist));
    atualizarBadge(); renderHistorico();
}

function limparHistorico() {
    if (!confirm('Limpar todo o histórico de pedidos?')) return;
    localStorage.removeItem('pharmashop_historico');
    atualizarBadge(); renderHistorico();
}

/* ─── EXPORTAR XLSX ─── */
function gerarXLSX() {
    var hist = carregarHistorico();
    if (hist.length === 0) { alert('Nenhum pedido salvo para exportar.'); return; }

    var wb = XLSX.utils.book_new();

    // ── PLANILHA 1: RESUMO DOS PEDIDOS ──
    var resumoRows = [
        ['PHARMASHOP — RELATÓRIO DE PEDIDOS'],
        ['Gerado em: ' + fmtDt()],
        [],
        ['PEDIDO','DATA/HORA','Nº ITENS','NOME DO PRODUTO','SUBTOTAL PRODUTOS','TAXA ENTREGA','TOTAL PEDIDO','FORMA PGTO']
    ];

    var totalGeral = 0;
    hist.forEach(function(p) {
        var ent = p.entrega || {};
        var vlTotal  = parseBR(p.total.replace('R$','').trim());
        var vlTaxa   = parseBR(ent.taxa);
        var vlSub    = vlTotal - vlTaxa;
        totalGeral  += vlTotal;
        var nomeProdutos = p.itens.map(function(it){ return it.produto; }).join(', ');
        resumoRows.push([
            p.id,
            p.data,
            p.itens.length,
            nomeProdutos,
            vlSub,
            vlTaxa,
            vlTotal,
            ent.forma || ''
        ]);
    });
    // Linha de total
    resumoRows.push([]);
    resumoRows.push(['', '', '', '', '', 'TOTAL GERAL →', totalGeral, '']);

    var wsResumo = XLSX.utils.aoa_to_sheet(resumoRows);

    // Larguras das colunas do resumo
    wsResumo['!cols'] = [
        {wch:10},{wch:20},{wch:9},{wch:40},{wch:18},{wch:14},{wch:14},{wch:14}
    ];
    XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo Pedidos');

    // ── PLANILHA 2: ITENS DETALHADOS ──
    var itensRows = [
        ['PHARMASHOP — ITENS DETALHADOS'],
        ['Gerado em: ' + fmtDt()],
        [],
        ['PEDIDO','DATA','FORMA PGTO','Nº ITEM','PRODUTO','QTDE','VL. UNITÁRIO','TOTAL ITEM']
    ];

    hist.forEach(function(p) {
        var ent = p.entrega || {};
        p.itens.forEach(function(it, i) {
            itensRows.push([
                p.id,
                p.data,
                ent.forma || '',
                i + 1,
                it.produto,
                parseInt(it.qtde) || 1,
                parseBR(it.vlUnit),
                parseBR(it.total)
            ]);
        });
    });

    var wsItens = XLSX.utils.aoa_to_sheet(itensRows);
    wsItens['!cols'] = [
        {wch:10},{wch:20},{wch:14},
        {wch:9},{wch:30},{wch:8},{wch:14},{wch:14}
    ];
    XLSX.utils.book_append_sheet(wb, wsItens, 'Itens Detalhados');

    // Salva
    var nome = 'pharmashop_' + new Date().toISOString().slice(0,10) + '.xlsx';
    XLSX.writeFile(wb, nome);
}

/* ─── GERAR RELATÓRIO PDF ─── */
function gerarRelatorioPDF() {
    var hist = carregarHistorico();
    if (hist.length === 0) { alert('Nenhum pedido salvo para gerar relatório.'); return; }

    var loja = dadosLoja();
    var agora = fmtDt();
    var { jsPDF } = window.jspdf;
    var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 14;

    doc.setFillColor(232, 98, 10);
    doc.rect(0, 0, pageW, 32, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(16); doc.setFont('helvetica', 'bold');
    doc.text(loja.nome, margin, 12);
    doc.setFontSize(8); doc.setFont('helvetica', 'normal');
    if (loja.cnpj) doc.text('CNPJ: ' + loja.cnpj, margin, 19);
    if (loja.end)  doc.text(loja.end, margin, 24);
    if (loja.tel)  doc.text('Tel: ' + loja.tel + '   |   Gerado em: ' + agora, margin, 29);
    doc.setFontSize(11); doc.setFont('helvetica', 'bold');
    doc.text('RELATÓRIO DE PEDIDOS', pageW - margin, 12, { align: 'right' });

    var totalGeral = 0;
    var rows = [];
    hist.forEach(function(p) {
        var cli = p.cliente || {};
        var ent = p.entrega || {};
        var vlPedido = parseBR(p.total.replace('R$','').trim());
        totalGeral += vlPedido;
        var produtos = p.itens.map(function(it){ return it.qtde + 'x ' + it.produto; }).join('\n');
        var cliInfo  = [cli.nome, cli.tel].filter(Boolean).join('\n');
        var endInfo  = [cli.end, cli.ref].filter(Boolean).join('\n');
        rows.push([ p.id, p.data, cliInfo, endInfo, ent.forma || '', produtos, String(p.itens.length), p.total ]);
    });

    doc.autoTable({
        startY: 38,
        head: [['PED.','DATA/HORA','CLIENTE','ENDEREÇO','PGTO','PRODUTOS','IT.','TOTAL']],
        body: rows,
        margin: { left: margin, right: margin },
        styles: { fontSize: 7, cellPadding: 2.5, lineColor: [30,58,95], lineWidth: 0.2, textColor: [10,22,40], valign: 'top' },
        headStyles: { fillColor: [10,22,40], textColor: [255,255,255], fontStyle: 'bold', fontSize: 7 },
        alternateRowStyles: { fillColor: [240,245,255] },
        columnStyles: {
            0: { cellWidth: 12, halign: 'center', fontStyle: 'bold' },
            1: { cellWidth: 28 },
            2: { cellWidth: 28 },
            3: { cellWidth: 35 },
            4: { cellWidth: 16 },
            5: { cellWidth: 'auto' },
            6: { cellWidth: 8, halign: 'center' },
            7: { cellWidth: 22, halign: 'right', fontStyle: 'bold' }
        }
    });

    var fy = doc.lastAutoTable.finalY + 4;
    doc.setFillColor(232, 98, 10);
    doc.rect(margin, fy, pageW - margin * 2, 10, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(9); doc.setFont('arial', 'bold');
    doc.text('TOTAL GERAL — ' + hist.length + ' pedido(s)', margin + 3, fy + 6.5);
    doc.text('R$ ' + totalGeral.toFixed(2).replace('.', ','), pageW - margin - 3, fy + 6.5, { align: 'right' });

    var totalPages = doc.internal.getNumberOfPages();
    for (var pg = 1; pg <= totalPages; pg++) {
        doc.setPage(pg);
        doc.setFillColor(10, 22, 40);
        doc.rect(0, pageH - 7, pageW, 7, 'F');
        doc.setTextColor(100, 130, 170);
        doc.setFontSize(6.5); doc.setFont('arial', 'normal');
        doc.text(loja.nome + ' — ' + agora, margin, pageH - 2.5);
        doc.text('Pag. ' + pg + '/' + totalPages, pageW - margin, pageH - 2.5, { align: 'right' });
    }

    doc.save('relatorio_' + new Date().toISOString().slice(0,10) + '.pdf');
}

function aplicarTema(modo) {
    var btn = document.getElementById('btnTema');
    var svgLua = '<svg class="ic" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    var svgSol = '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
    if (modo === 'dia') {
        document.body.classList.add('modo-dia');
        btn.innerHTML = svgLua + 'Modo Noite';
    } else {
        document.body.classList.remove('modo-dia');
        btn.innerHTML = svgSol + 'Modo Dia';
    }
    localStorage.setItem('pharmashop_tema', modo);
}

function alternarTema() {
    var atual = document.body.classList.contains('modo-dia') ? 'dia' : 'noite';
    aplicarTema(atual === 'dia' ? 'noite' : 'dia');
}

(function() {
    var temaSalvo = localStorage.getItem('pharmashop_tema') || 'noite';
    aplicarTema(temaSalvo);
})();

/* ═══════════════ CLIENTES (ADICIONADO) ═══════════════ */
(function () {
    var KEY = 'pharmashop_clientes';
    function $(id) { return document.getElementById(id); }
    function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
    function save(l) { localStorage.setItem(KEY, JSON.stringify(l)); atualizarContador(); }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function norm(s) { return String(s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
    function digits(s) { return String(s || '').replace(/\D/g, ''); }
    function match(c, q) {
        if (!q) return true;
        var d = digits(q);
        return norm(c.nome + ' ' + c.end + ' ' + c.ref).indexOf(norm(q)) > -1 || (d && digits(c.tel).indexOf(d) > -1);
    }
    function ordenar(l) { return l.slice().sort(function (a, b) { return a.nome.localeCompare(b.nome); }); }

    /* ── Aba Clientes ── */
    var tabs = document.querySelector('.tabs');
    var btnTab = document.createElement('button');
    btnTab.className = 'tab';
    btnTab.setAttribute('onclick', "trocarAba('clientes', this)");
    btnTab.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clientes <span class="badge-count" id="badge_cli">0</span>';
    tabs.appendChild(btnTab);

    var sec = document.createElement('div');
    sec.id = 'sec-clientes'; sec.className = 'section';
    sec.innerHTML =
        '<div class="card">' +
          '<div class="cliente-info">' +
            '<div class="bloco-titulo" id="cad_titulo">Novo Cliente</div>' +
            '<input type="hidden" id="cad_id">' +
            '<div class="fields-grid">' +
              '<label>NOME<input type="text" id="cad_nome" maxlength="50"></label>' +
              '<label>TELEFONE<input type="text" id="cad_tel" maxlength="20" placeholder="(XX) XXXXX-XXXX"></label>' +
              '<label style="flex:2;min-width:200px;">ENDEREÇO<input type="text" id="cad_end" maxlength="80"></label>' +
              '<label>PONTO DE REFERÊNCIA<input type="text" id="cad_ref" maxlength="60"></label>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button class="btn btn-salvar" id="cad_salvar">Salvar Cliente</button>' +
              '<button class="btn btn-limpar" id="cad_cancelar">Cancelar</button>' +
            '</div>' +
          '</div>' +
          '<div class="backup-row">' +
            '<button class="btn btn-add" id="cad_exportar"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Backup dos Clientes</button>' +
            '<button class="btn btn-print" id="cad_importar"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Restaurar Backup</button>' +
            '<input type="file" id="cad_arquivo" accept=".json,application/json" style="display:none">' +
            '<small>Gera um arquivo .json para levar os clientes a outra máquina.</small>' +
          '</div>' +
          '<div class="fields-grid" style="margin-bottom:12px;"><label>BUSCAR NA LISTA<input type="text" id="cad_busca" placeholder="NOME, TELEFONE OU ENDEREÇO"></label></div>' +
          '<div id="lista-clientes"></div>' +
        '</div>';
    $('sec-historico').parentNode.insertBefore(sec, $('cupom-impressao'));

    /* ── Caixa de busca no Novo Pedido ── */
    var box = document.createElement('div');
    box.className = 'cliente-info';
    box.innerHTML =
        '<div class="bloco-titulo">Buscar Cliente</div>' +
        '<div class="busca-wrap">' +
          '<div class="fields-grid"><label>NOME OU TELEFONE<input type="text" id="bc_q" placeholder="DIGITE PARA BUSCAR..." autocomplete="off"></label></div>' +
          '<div class="busca-res" id="bc_res"></div>' +
        '</div>' +
        '<div class="cli-actions">' +
          '<button class="btn-sm btn-cli-salvar" id="bc_salvar">Salvar/Atualizar cliente com os dados abaixo</button>' +
        '</div>';
    var blocoCliente = document.querySelector('#sec-pedido .cliente-info');
    blocoCliente.parentNode.insertBefore(box, blocoCliente);

    /* ── Operações (CRUD) ── */
    function upsert(c) {
        var l = load(), i = -1;
        if (c.id) i = l.findIndex(function (x) { return x.id === c.id; });
        if (i < 0 && digits(c.tel)) i = l.findIndex(function (x) { return digits(x.tel) === digits(c.tel); });
        if (i < 0 && !digits(c.tel)) i = l.findIndex(function (x) { return norm(x.nome) === norm(c.nome); });
        if (i >= 0) { c.id = l[i].id; l[i] = c; } else { c.id = uid(); l.push(c); }
        save(l);
        return i >= 0 ? 'atualizado' : 'cadastrado';
    }
    function excluir(id) { save(load().filter(function (x) { return x.id !== id; })); }
    function porId(id) { return load().find(function (x) { return x.id === id; }); }

    function usarNoPedido(c) {
        $('cli_nome').value = c.nome || '';
        $('cli_tel').value = c.tel || '';
        $('cli_end').value = c.end || '';
        $('cli_ref').value = c.ref || '';
        $('bc_q').value = '';
        $('bc_res').style.display = 'none';
    }

    /* ── Busca no pedido ── */
    $('bc_q').addEventListener('input', function () {
        var q = this.value.trim(), res = $('bc_res');
        if (!q) { res.style.display = 'none'; return; }
        var r = ordenar(load().filter(function (c) { return match(c, q); })).slice(0, 8);
        res.innerHTML = r.length ? r.map(function (c) {
            return '<div class="busca-item" data-id="' + c.id + '">' + escHtml(c.nome) +
                   '<small>' + escHtml([c.tel, c.end].filter(Boolean).join(' | ')) + '</small></div>';
        }).join('') : '<div class="busca-vazio">Nenhum cliente encontrado.</div>';
        res.style.display = 'block';
    });
    $('bc_res').addEventListener('click', function (e) {
        var it = e.target.closest('.busca-item'); if (!it) return;
        var c = porId(it.getAttribute('data-id')); if (c) usarNoPedido(c);
    });
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.busca-wrap')) $('bc_res').style.display = 'none';
    });
    $('bc_salvar').addEventListener('click', function () {
        var c = dadosCliente();
        if (!c.nome) { alert('Preencha o nome do cliente.'); return; }
        alert('Cliente ' + upsert(c) + ' com sucesso!');
    });

    /* ── Aba Clientes: formulário e lista ── */
    function limparForm() {
        ['cad_id', 'cad_nome', 'cad_tel', 'cad_end', 'cad_ref'].forEach(function (id) { $(id).value = ''; });
        $('cad_titulo').textContent = 'Novo Cliente';
        $('cad_salvar').textContent = 'Salvar Cliente';
    }
    $('cad_cancelar').addEventListener('click', limparForm);
    $('cad_salvar').addEventListener('click', function () {
        var c = {
            id: $('cad_id').value,
            nome: $('cad_nome').value.trim().toUpperCase(),
            tel: $('cad_tel').value.trim(),
            end: $('cad_end').value.trim().toUpperCase(),
            ref: $('cad_ref').value.trim().toUpperCase()
        };
        if (!c.nome) { alert('Informe o nome do cliente.'); return; }
        upsert(c); limparForm(); renderClientes();
    });
    $('cad_busca').addEventListener('input', renderClientes);

    function renderClientes() {
        var q = $('cad_busca').value.trim(), lista = $('lista-clientes');
        var r = ordenar(load().filter(function (c) { return match(c, q); }));
        if (!r.length) { lista.innerHTML = '<div class="hist-vazio">Nenhum cliente encontrado.</div>'; return; }
        lista.innerHTML = r.map(function (c) {
            return '<div class="hist-card" data-id="' + c.id + '">' +
                '<div class="hist-id">' + escHtml(c.nome) + '</div>' +
                (c.tel ? '<div class="hist-cliente">📞 ' + escHtml(c.tel) + '</div>' : '') +
                (c.end ? '<div class="hist-itens">📍 ' + escHtml(c.end) + '</div>' : '') +
                (c.ref ? '<div class="hist-itens">Ref.: ' + escHtml(c.ref) + '</div>' : '') +
                '<div class="cli-actions">' +
                  '<button class="btn-sm" data-act="usar" style="background:#1a3a5c;border:1px solid #2a5f8f;">Usar no pedido</button>' +
                  '<button class="btn-sm" data-act="editar" style="background:#2a2a0a;border:1px solid #6a5a0a;">Editar</button>' +
                  '<button class="btn-sm btn-sm-del" data-act="excluir">Excluir</button>' +
                '</div></div>';
        }).join('');
    }
    window.renderClientes = renderClientes;

    $('lista-clientes').addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]'); if (!b) return;
        var id = b.closest('.hist-card').getAttribute('data-id'), c = porId(id); if (!c) return;
        var act = b.getAttribute('data-act');
        if (act === 'usar') {
            usarNoPedido(c);
            trocarAba('pedido', document.querySelectorAll('.tab')[0]);
        } else if (act === 'editar') {
            $('cad_id').value = c.id; $('cad_nome').value = c.nome; $('cad_tel').value = c.tel;

            $('cad_salvar').textContent = 'Atualizar Cliente';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (act === 'excluir') {
            if (!confirm('Excluir este cliente do cadastro?')) return;
            excluir(id); renderClientes();
        }
    });

    /* ── Backup: exportar / importar ── */
    $('cad_exportar').addEventListener('click', function () {
        var l = load();
        if (!l.length) { alert('Nenhum cliente cadastrado para fazer backup.'); return; }
        var dados = { app: 'pharmashop', tipo: 'clientes', versao: 1, exportadoEm: new Date().toISOString(), clientes: l };
        var blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'pharmashop_clientes_' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    });

    $('cad_importar').addEventListener('click', function () { $('cad_arquivo').click(); });

    $('cad_arquivo').addEventListener('change', function () {
        var f = this.files[0], inp = this;
        if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
            try {
                var d = JSON.parse(rd.result);
                var arr = Array.isArray(d) ? d : d.clientes;
                if (!Array.isArray(arr)) throw new Error('formato');
                var l = load(), add = 0, upd = 0;
                arr.forEach(function (c) {
                    if (!c || !c.nome) return;
                    var n = { id: c.id || uid(), nome: String(c.nome).toUpperCase(), tel: c.tel || '', end: String(c.end || '').toUpperCase(), ref: String(c.ref || '').toUpperCase() };
                    var i = -1;
                    if (digits(n.tel)) i = l.findIndex(function (x) { return digits(x.tel) === digits(n.tel); });
                    else i = l.findIndex(function (x) { return !digits(x.tel) && norm(x.nome) === norm(n.nome); });
                    if (i >= 0) { n.id = l[i].id; l[i] = n; upd++; }
                    else { if (l.some(function (x) { return x.id === n.id; })) n.id = uid(); l.push(n); add++; }
                });
                save(l); renderClientes();
                alert('Backup restaurado!\n' + add + ' cliente(s) novo(s) e ' + upd + ' atualizado(s).');
            } catch (e) {
                alert('Arquivo inválido. Selecione um backup de clientes gerado pelo PHARMASHOP.');
            }
            inp.value = '';
        };
        rd.readAsText(f);
    });

    function atualizarContador() { $('badge_cli').textContent = load().length; }

    /* ── Ganchos sem alterar o código original ── */
    var _aplicarOrig = window._aplicarAba;
    window._aplicarAba = function (aba, el) {
        _aplicarOrig(aba, el);
        if (aba === 'clientes') renderClientes();
    };

    // Ao finalizar um pedido, o cliente é cadastrado/atualizado automaticamente
    var _salvarOrig = window.salvarPedido;
    window.salvarPedido = function () {
        var c = dadosCliente(), temItens = coletarItens().length > 0;
        if (temItens && c.nome) upsert(c);
        _salvarOrig();
    };

    /* ── Novo Pedido: limpa também a busca de cliente ── */
    var _novoOrig = window.novoPedido;
    window.novoPedido = function () {
        _novoOrig();
        $('bc_q').value = '';
        $('bc_res').style.display = 'none';
    };

    // A aba "Novo Pedido" (topo) também começa um pedido limpo ao ser clicada.
    // "Usar no pedido" não passa por aqui, então o cliente escolhido é mantido.
    tabs.querySelector('.tab').addEventListener('click', function () {
        window.novoPedido();
    });

    atualizarContador();
})();
</script>
</body>
</html>
